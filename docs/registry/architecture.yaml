# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: collision_query
    status: active
    pattern: "direct_call"
    producer: "track-collision"
    signal_signature: "cast_ground/sweep_walls with caller-owned GroundHit/WallHit and QueryCursor; t = n*SIM_DT; started_inside returns at once; touch = fraction 1.0"
    adr: docs/architecture/adr-0002-collision-backend-and-surface-attributes.md
    referenced_by:
      - docs/architecture/adr-0002-collision-backend-and-surface-attributes.md
      - docs/architecture/adr-0007-native-simulation-core.md   # native implementation; create(packed) construction
    added: 2026-11-22
    revised: ""
  - contract: kart_snapshot_and_events
    status: active
    pattern: "shared_resource"
    producer: "kart-physics"
    signal_signature: "KartSnapshot (total world velocity, throttle, events bits 0-7 pinned) and KartEvent (bump pose tick = sampled remote record tick)"
    adr: docs/architecture/adr-0003-kart-physics-model.md
    referenced_by:
      - docs/architecture/adr-0003-kart-physics-model.md
      - docs/architecture/adr-0007-native-simulation-core.md   # snapshots and events leave RaceSim double-buffered
    added: 2026-11-22
    revised: ""
  - contract: network_wire_v10
    status: active
    pattern: "rpc"
    producer: "network-session"
    signal_signature: "41 B snapshot record on ch1 unreliable_ordered 30 Hz; events on ch2 reliable; control ch0; VERSION 10 + source_sha256 + bake_key refusal"
    adr: docs/architecture/adr-0006-network-snapshot-3d.md
    referenced_by:
      - docs/architecture/adr-0006-network-snapshot-3d.md
    added: 2026-11-22
    revised: ""


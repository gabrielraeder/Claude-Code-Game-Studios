# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: race_clock
    status: active
    owner_system: race-session-and-synced-clock
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    interface: "Synced race time is authoritative; target tick = floor(synced_time / SIM_DT); simulation evaluates tick n at t = n * SIM_DT; continuous synced time for presentation only"
    write_access: race-session-only
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
    revised: ""
  - state: kart_orientation
    status: active
    owner_system: kart-physics
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    interface: "BodyState.basis (Basis, -Z heading, Y up, re-orthonormalised every tick); yaw is derived only; gravity is a per-body vector"
    write_access: kart-physics-only
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
    revised: ""


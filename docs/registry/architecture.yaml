# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: simulation_timestep
    status: active
    api: "const SIM_DT = 1.0 / 60.0 in _physics_process, ticks pinned to 60, max steps 8, asserted at boot"
    not: "the delta argument; Engine.get_physics_interpolation_fraction() for visuals"
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    reason: "Reproducible ticks that follow the synced clock; fraction comes from the synced clock"
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
    revised: ""
  - purpose: world_axes_and_blender_export
    status: active
    api: "Godot +Y up, -Z forward, metres; Blender glTF export +Y Up (Blender +Y -> Godot -Z); pose empties +Y along travel; kart models authored facing Blender -Y and turned 180 deg in the kart scene"
    not: "rotating or rescaling whole tracks at import"
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    reason: "One convention from Blender to the wire"
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
    revised: ""
  - purpose: mirror_mode
    status: active
    api: "Once at track load: positions x -> -x, bases M*B*M with M = diag(-1,1,1), side data swapped, winding flipped; TrackCollision and CourseData expose mirrored()"
    not: "per-tick mirroring or inverting steering"
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    reason: "Mirror without a second set of track data"
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
    revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: global_random_in_simulation
    status: "superseded_by: ADR-0007"
    description: "Simulation code must not call global randf, randi or randomize; it uses its per-consumer RandomNumberGenerator seeded from hash(race_seed, racer_slot, system_id)."
    why: "Global random breaks same-machine reproducibility and shifts every trace when one system adds a call."
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
  - pattern: stored_scalar_yaw_or_hardcoded_down
    status: active
    description: "New simulation code must not store a scalar yaw as state or hard-code Vector3.DOWN as gravity."
    why: "Breaks walls, loops and anti-gravity."
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21
  - pattern: new_code_referencing_legacy
    status: active
    description: "New code must not reference src/legacy/, reuse a frozen class_name, or read a frozen .tres instance; shared data classes live in src/data/ and change only additively."
    why: "Keeps the frozen 2.5D game and its regression oracle unchanged until A3."
    adr: docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-21

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "A system must never write to state owned by another system.
#       Use signals or method calls on the owner instead."
#     why: "Direct state writes create race conditions and break the state
#       ownership model. The owning system must be the sole writer."
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26
  - pattern: encode_half_unrounded
    status: active
    description: "Never call PackedByteArray.encode_half on an unclamped or unrounded value; clamp to +-65504 and pre-round (ADR-0006)"
    why: "encode_half truncates toward zero and overflows to inf on 4.8-beta3"
    adr: docs/architecture/adr-0006-network-snapshot-3d.md
    referenced_by:
      - docs/architecture/adr-0006-network-snapshot-3d.md
    added: 2026-11-22
    revised: ""
  - pattern: get_packet_channel_in_rpc
    status: active
    description: "Do not use multiplayer_peer.get_packet_channel()/get_packet_mode() to classify bytes inside an RPC handler"
    why: "They describe the next queued packet and error when the queue is empty"
    adr: docs/architecture/adr-0006-network-snapshot-3d.md
    referenced_by:
      - docs/architecture/adr-0006-network-snapshot-3d.md
    added: 2026-11-22
    revised: ""
  - pattern: free_space_before_bodies
    status: active
    description: "CollisionQuery.dispose() frees bodies, then shapes, then the space"
    why: "Freeing the space first leaves dangling body RIDs and crashes later"
    adr: docs/architecture/adr-0002-collision-backend-and-surface-attributes.md
    referenced_by:
      - docs/architecture/adr-0002-collision-backend-and-surface-attributes.md
    added: 2026-11-22
    revised: ""
  - pattern: global_random_in_native_or_gdscript_simulation
    status: active
    description: "Simulation code, GDScript and native, must not use global randf, randi or randomize, and native per-tick code must not use rand(), <random>, std::random_device or iteration over unordered containers. It uses a per-consumer RandomNumberGenerator (godot-cpp in native code) created at setup and seeded from hash(race_seed, racer_slot, system_id) computed in GDScript."
    why: "Global or unseeded random breaks same-machine reproducibility; extends global_random_in_simulation (ADR-0001), which this entry replaces, to native code."
    adr: docs/architecture/adr-0007-native-simulation-core.md
    referenced_by:
      - docs/architecture/adr-0001-simulation-conventions-and-code-layout.md
    added: 2026-11-22
    revised: ""
  - pattern: per_kart_native_calls_in_gdscript_tick_loop
    status: active
    description: "GDScript must not loop over karts calling native per-kart methods (KartBody.step, CollisionQuery.cast_ground and so on) in the production tick. It calls the eight RaceSim stage calls."
    why: "Each crossing costs about 0.17 us and splits state ownership and stage order across the boundary."
    adr: docs/architecture/adr-0007-native-simulation-core.md
    referenced_by:
      - docs/architecture/adr-0007-native-simulation-core.md
    added: 2026-11-22
    revised: ""
  - pattern: per_tick_resource_read_in_native_code
    status: active
    description: "Per-tick native code must not read a Resource, Dictionary or Variant container. Data is packed once at setup (pack_native) into plain C++ structs."
    why: "Per-tick Variant work allocates and costs the speed the port exists to gain."
    adr: docs/architecture/adr-0007-native-simulation-core.md
    referenced_by:
      - docs/architecture/adr-0007-native-simulation-core.md
    added: 2026-11-22
    revised: ""
  - pattern: committed_native_dlls
    status: active
    description: "Built DLLs, godot-cpp, the API dump and the SCons venv are not committed. Each clone builds with tools/build_native.sh, and tools/build_native.sh --check fails on a stale DLL."
    why: "A committed DLL can silently disagree with its sources and cannot be reviewed."
    adr: docs/architecture/adr-0007-native-simulation-core.md
    referenced_by:
      - docs/architecture/adr-0007-native-simulation-core.md
    added: 2026-11-22
    revised: ""
  - pattern: gdscript_script_property_read_from_cpp
    status: active
    description: "Native code must not read a GDScript script property (Object::get on a script field). Resources pass their data through pack_native() with a checked schema."
    why: "A renamed or missing field silently returns a null Variant, which becomes 0 in C++."
    adr: docs/architecture/adr-0007-native-simulation-core.md
    referenced_by:
      - docs/architecture/adr-0007-native-simulation-core.md
    added: 2026-11-22
    revised: ""
